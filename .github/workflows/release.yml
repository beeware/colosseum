name: Create Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; jobs declare any additional permissions they require.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    # The called workflow's package job needs id-token/attestations
    # permissions to create the package provenance attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci.yml
    with:
      attest-package: "true"

  release:
    name: Create Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # This permission is required for trusted publishing.
      id-token: write
    steps:
      - name: Set build variables
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" | tee -a $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.x"

      - name: Get packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: dist

      - name: Install packages
        run: pip install dist/*.whl

      - name: Check version number
        # Check that the setuptools_scm-generated version number is still the same when
        # installed from a wheel with setuptools_scm not present.
        run: |
          set -x
          test $(python -c "from colosseum import __version__; print(__version__)") = $VERSION

      - name: Create release
        # `gh release create` fails if any listed artifact is missing, matching
        # the behavior of the previously used release action.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --draft \
            --verify-tag

      - name: Publish release to Test PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          repository_url: https://test.pypi.org/legacy/
