[build-system]
requires = [
    "setuptools==84.0.0",
    "setuptools_scm==10.2.1",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "colosseum"
description = "An independent implementation of the CSS layout algorithm"
readme = "README.md"
requires-python = ">= 3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name="Russell Keith-Magee", email="russell@keith-magee.com"}
]
maintainers = [
    {name="BeeWare Team", email="team@beeware.org"}
]
keywords = [
    "CSS",
]
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: User Interfaces",
]

[dependency-groups]
# Extras used by developers *of* colosseum are pinned to specific versions to
# ensure environment consistency.
pre-commit = [
    "pre-commit == 4.6.2",
]

test = [
    "pytest == 9.1.1",
]

towncrier = [
    "towncrier==25.8.0",
]

tox = [
    "tox-uv == 1.36.0",
]

dev = [
    "setuptools_scm == 10.2.1",
    {include-group = "pre-commit"},
    {include-group = "test"},
    {include-group = "tox"},
]

# Docs are always built on a specific Python version; see RTD and tox config files.
# beeware-docs-tools is not published to PyPI; install from the base repo.
docs = [
    "beeware-docs-tools @ git+https://github.com/beeware/beeware-docs-tools@main",
]

[project.urls]
Homepage = "https://github.com/beeware/colosseum"
Funding = "https://beeware.org/contributing/membership/"
Tracker = "https://github.com/beeware/colosseum/issues"
Source = "https://github.com/beeware/colosseum"

[tool.ruff.lint]
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    # They may be worth occasionally turning on just to see if something could actually
    # use improvement.
    # "SIM",    # flake8-simplify
]
ignore = [
    "E501",    # line length
    "B007",    # loop control variable not used
    "B018",    # useless expression
    "B019",    # memory leaks from functools.lru_cache / functools.cache
    "B024",    # abstract base class without abstract methods / properties
    "B027",    # empty method in abstract base class
    "B904",    # use raise ... from ...
    "C400",    # unnecessary generator
    "C408",    # use dict literal instead of dict()
    "C414",    # unnecessary list() use within sorted()
    "C416",    # unnecessary list comprehension
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["F401"]
# Ignores needed to pass the Ruff 0.16 update.
"src/colosseum/declaration.py" = ["TRY004"]
"src/colosseum/engine.py" = ["TRY002"]
"src/colosseum/parser.py" = ["TRY004"]
"src/colosseum/units.py" = ["RUF012"]
"src/colosseum/wrappers.py" = ["BLE001", "PLC0206", "RUF012"]
"tests/web_platform/css_flexbox_1/*.py" = ["N999"]
"utils/w3c.py" = ["EXE001", "SIM115"]

[tool.rumdl]
flavor = "mkdocs"
include = ["**/*.md"]
exclude = ["docs/en/SUMMARY.md", "CODE_OF_CONDUCT.md", "changes/template.md"]
respect-gitignore = true

# Disable rules:
# MD014: Force commands in codeblocks to show output
disable = ["MD014"]

[tool.rumdl.MD013]  # Line length
line_length = 999999  # Force reflow to paragraph content to remove linebreaks
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.rumdl.MD033]  # No inline HTML
allowed_elements = ["nospell",]  # pyspelling inline disable tag

[tool.rumdl.MD061]
terms = ["TODO"]

[tool.rumdl.per-file-ignores]
# MD041: First line in file should be level 1 heading; title will be included in the target page
"docs/en/how-to/contribute/**/*.md" = ["MD041"]
"docs/en/how-to/contribute/*.md" = ["MD041"]
# MD041: Change note fragments are prose snippets, not standalone documents
"changes/*.md" = ["MD041"]

[tool.setuptools_scm]
# To enable SCM versioning, we need an empty tool configuration for setuptools_scm

[tool.towncrier]
directory = "changes"
package = "colosseum"
package_dir = "src"
filename = "docs/en/about/releases.md"
title_format = false
template = "changes/template.md"
start_string = "<!-- towncrier release notes start -->"
type = [
    { directory = "feature", name = "Features", showcontent = true },
    { directory = "bugfix", name = "Bugfixes", showcontent = true },
    { directory = "removal", name = "Backward Incompatible Changes", showcontent = true },
    { directory = "doc", name = "Documentation", showcontent = true },
    { directory = "misc", name = "Misc", showcontent = false },
]
